name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Audio and behavior checks
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          bash test.sh
      - name: Release build, local signing and packaging
        run: bash build-app.sh --package
