name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION="$(cat VERSION)"
          [[ "$RELEASE_TAG" == "v$APP_VERSION" ]]
          [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == tag ]]
          git merge-base --is-ancestor HEAD origin/main
          [[ "$(uname -m)" == arm64 ]]
      - name: Audio and behavior checks
        run: bash test.sh
      - name: Build, sign and package
        run: bash build-app.sh --package
      - name: Publish release with downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ARCHIVE="dist/LocalAudioPlayer-${RELEASE_TAG}-macOS-arm64.zip"
          NOTES='Apple Silicon 版，部署目标 macOS 13+，已通过 macOS 15 CI 验证。下载 ZIP 后解压打开应用。当前仅使用 ad hoc 临时签名，没有 Developer ID 签名或 Apple 公证，其他 Mac 下载后可能被 Gatekeeper 阻止打开。附带 SHA-256 校验文件；校验和不等于开发者签名。'
          gh release create "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes --notes "$NOTES" --latest
